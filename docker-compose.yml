services:
  codexclaw:
    build:
      context: .
      dockerfile: Dockerfile
    image: codexclaw:local
    container_name: codexclaw
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      CODEXCLAW_WORKSPACE_ROOT: /home/node/.codexclaw/workspace
      CODEXCLAW_WORKSPACE_TEMPLATE_ROOT: /app/.codexclaw/initial-workspace
    volumes:
      - codexclaw_data:/home/node/.codexclaw
    command: ["idle"]
    networks:
      - codexclaw_shared

volumes:
  codexclaw_data:

networks:
  codexclaw_shared:
    name: codexclaw_shared
